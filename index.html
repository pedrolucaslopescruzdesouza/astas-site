<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botafogo SAF | Estratégia Corporativa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-black text-white selection:bg-white selection:text-black antialiased overflow-hidden">

    <!-- Navbar Oficial -->
    <header class="navbar fixed top-0 w-full z-50">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <!-- Logo Oficial do Botafogo -->
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c7/Botafogo_Regatas_logo.png" alt="Escudo Botafogo" class="h-12 w-12 hover:scale-110 transition-transform">
                <span class="font-heading font-black text-2xl tracking-widest uppercase">Botafogo</span>
            </div>
            <nav class="hidden md:flex space-x-8 font-heading text-sm font-semibold tracking-wide text-gray-400">
                <a href="index.html" class="text-white">Início</a>
                <a href="diagnostico.html" class="hover:text-white transition-colors">Diagnóstico</a>
                <a href="estrategia.html" class="hover:text-white transition-colors">Estratégia</a>
            </nav>
        </div>
    </header>

    <!-- Seção Principal com Campo Animado -->
    <main class="campo-animado h-screen w-full flex items-center relative">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full grid grid-cols-1 md:grid-cols-2 gap-8 items-center z-10 pt-20">
            
            <!-- Texto de Impacto -->
            <div data-aos="fade-up" data-aos-duration="1000">
                <h2 class="text-gray-400 font-heading tracking-[0.2em] text-sm uppercase mb-4">Relatório Executivo 2024-2029</h2>
                <h1 class="font-heading font-black text-5xl md:text-6xl lg:text-7xl leading-tight mb-6 uppercase">
                    O Desafio <br>
                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-gray-100 to-gray-500">Financeiro</span> <br>
                    Da SAF.
                </h1>
                <p class="text-gray-300 text-lg mb-8 max-w-lg font-light">
                    Do paradoxo entre receitas recordes e o colapso de liquidez ao plano definitivo de reestruturação corporativa.
                </p>
                <a href="diagnostico.html" class="inline-flex items-center justify-center px-8 py-4 text-base font-bold text-black bg-white hover:bg-gray-200 transition-colors uppercase tracking-wider rounded-none">
                    Iniciar Apresentação <i class="fa-solid fa-arrow-right ml-3"></i>
                </a>
            </div>

            <!-- Imagem do Jogador Animado -->
            <div class="relative h-full hidden md:flex justify-end items-end">
                <!-- Se você tiver um PNG recortado de um jogador (ex: Luiz Henrique), mude o link aqui! -->
                <img src="https://images.unsplash.com/photo-1579952363873-27f3bade9f55?q=80&w=600&auto=format&fit=crop" style="mix-blend-mode: luminosity; mask-image: linear-gradient(to bottom, black 50%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, black 50%, transparent 100%);" alt="Jogador" class="jogador-animado max-h-[80vh] object-contain">
            </div>
        </div>

        <!-- Bola Rolando -->
        <div class="bola-container">
            <i class="fa-solid fa-futbol bola-animada"></i>
        </div>
    </main>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>AOS.init();</script>
</body>
</html>
